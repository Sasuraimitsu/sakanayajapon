  <style>
    /* 1. 全体：魚の写真を全面に敷き、白で透かす */
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #dfe7ee; /* 画像読込前のフォールバック色（薄い青灰） */
      color: #12324f;
    }

    /* 背景スライドショー（複数写真をフェードで切り替え） */
    .bg-slideshow { position: fixed; inset: 0; z-index: -2; }
    .bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }
    .bg-slide.active { opacity: 1; }

    /* 2. 透かし：写真の上に白を重ねて薄く見せる。数値を下げると写真が濃くなる */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.72);
      z-index: -1;
    }

    /* 3. 法人のお客様への入口（ページ最上部の細いバー） */
    .biz-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      background: #12324f;
      color: #eaf2f8;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.02em;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .biz-bar:hover { background: #1a4468; }
    .biz-bar .biz-arrow { opacity: 0.75; }
    .biz-bar-en { opacity: 0.7; font-weight: normal; }

    /* 4. 本体：箱で囲わず、画面幅いっぱいに広げる */
    .main {
      width: 100%;
      max-width: 1040px;
      margin: auto 0;              /* 縦方向の中央寄せ */
      padding: 36px 16px 48px;
      box-sizing: border-box;
      text-align: center;
    }

    .logo-container img {
      width: 150px;
      border-radius: 24px;
      filter: drop-shadow(0 6px 18px rgba(10, 26, 43, 0.22));
      margin-bottom: 12px;
    }

    .tagline {
      color: #12324f;
      font-size: 1rem;
      font-weight: bold;
      line-height: 1.8;
      margin: 0 0 30px;
      letter-spacing: 0.05em;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    /* 5. カテゴリータイル：スマホ2列、タブレット以上3列 */
    nav {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 720px) {
      nav { grid-template-columns: repeat(3, 1fr); gap: 18px; }
    }

    nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 128px;
      padding: 24px 14px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #0056b3;
      text-decoration: none;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      font-weight: bold;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 6px 20px rgba(10, 26, 43, 0.12);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    nav a i { font-size: 30px; }

    nav a:hover {
      background: #007BFF;
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(10, 26, 43, 0.2);
    }

    /* Telegramボタン */
    nav a.telegram { background: #0088cc; color: #fff; }
    nav a.telegram:hover { background: #0071ab; }

    /* Facebookボタン */
    nav a.facebook-like { background: #1877f2; color: #fff; }
    nav a.facebook-like:hover { background: #1462c9; }

    @media (max-width: 420px) {
      .biz-bar { font-size: 12px; padding: 10px 12px; }
      .biz-bar-en { display: none; }
      .main { padding: 28px 14px 40px; }
      .logo-container img { width: 120px; }
      .tagline { font-size: 0.9rem; }
      nav { gap: 10px; }
      nav a { min-height: 112px; padding: 18px 10px; font-size: 13px; }
      nav a i { font-size: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg-slideshow" id="bgSlideshow"></div>

    <div class="tagline">A Taste of the Sea, For Every Cambodian Home<br>海のある日常を、カンボジアの食卓に。</div>

    <nav>
      <a href="menu.html"><i class="fa-solid fa-utensils"></i> MENU</a>
      <a href="howto.html"><i class="fa-solid fa-circle-play"></i> HOW TO ORDER FOR LINE USER</a>

        Please like on Facebook <i class="fa-solid fa-thumbs-up thumb"></i>
      </a>
    </nav>
  </div>

  <script>
    // ▼ 背景に表示する写真のファイル名（横長・高解像度推奨）。ここに足すだけで枚数を増やせます。
    const bgImages = [
      'fish-photo.jpg',  // ① 魚（鮮魚）
      'sashimi.jpg',     // ② 刺身の盛り合わせ
      'event.jpg'        // ③ イベントの様子（解体ショーなど）
    ];

    const container = document.getElementById('bgSlideshow');
    const slides = [];
    let idx = 0, timer = null;

    function startRotation() {
      if (slides.length > 1 && !timer) {
        timer = setInterval(() => {
          slides[idx].classList.remove('active');
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add('active');
        }, 6000); // 6秒ごとに切り替え
      }
    }

    // 読み込めた画像だけを順に背景へ追加（存在しないファイルは自動でスキップ）
    bgImages.forEach(src => {
      const probe = new Image();
      probe.onload = () => {
        const d = document.createElement('div');
        d.className = 'bg-slide';
        d.style.backgroundImage = `url('${src}')`;
        container.appendChild(d);
        slides.push(d);
        if (slides.length === 1) d.classList.add('active'); // 最初の1枚はすぐ表示
        startRotation();
      };
      probe.src = src;
    });
  </script>
</body>
</html>
